<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste N8N Direto - KompraX</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #0056b3; }
        .result { background: #f8f9fa; padding: 15px; border-radius: 4px; margin: 10px 0; border-left: 4px solid #007bff; }
        .error { border-left-color: #dc3545; background: #f8d7da; }
        .success { border-left-color: #28a745; background: #d4edda; }
        pre { white-space: pre-wrap; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Teste Direto N8N KompraX</h1>
        <p>Este teste verifica se o webhook N8N está funcionando corretamente.</p>
        
        <button onclick="testN8NDirect()">🧪 Testar N8N Direto</button>
        <button onclick="testLocalAPI()">🏠 Testar API Local</button>
        <button onclick="testProdAPI()">🌐 Testar API Produção</button>
        <button onclick="clearResults()">🗑️ Limpar Resultados</button>
        
        <div id="results"></div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        
        function addResult(title, content, isError = false) {
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `
                <h3>${title}</h3>
                <pre>${content}</pre>
            `;
            resultsDiv.appendChild(div);
        }
        
        function clearResults() {
            resultsDiv.innerHTML = '';
        }
        
        async function testN8NDirect() {
            const url = 'https://webhookub.mooveinsd.com.br/webhook/1a7ff005-dbd8-40fc-a0f7-2c675a2f3c94/chat';
            const payload = {
                selectedServicePlan: 'Premium',
                userName: 'Teste Direto N8N',
                userEnterprise: 'Empresa Teste',
                userNumber: '48999887766',
                userMessage: 'Teste de conectividade direta com N8N',
                promoActive: true
            };
            
            addResult('🧪 Testando N8N Direto...', `URL: ${url}\nPayload: ${JSON.stringify(payload, null, 2)}`);
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'User-Agent': 'KompraX-WebApp/1.0'
                    },
                    body: JSON.stringify(payload),
                    signal: AbortSignal.timeout(30000)
                });
                
                const responseText = await response.text();
                
                if (response.ok) {
                    addResult('✅ N8N Funcionando!', `Status: ${response.status}\nResposta: ${responseText}`);
                } else {
                    addResult('❌ N8N com Erro', `Status: ${response.status} ${response.statusText}\nResposta: ${responseText}`, true);
                }
            } catch (error) {
                if (error.name === 'TimeoutError') {
                    addResult('❌ Timeout N8N', `Erro: Timeout após 30 segundos\n\nIsso pode indicar:\n- N8N está sobrecarregado\n- URL incorreta\n- Problema de rede`, true);
                } else {
                    addResult('❌ Erro de Conexão N8N', `Erro: ${error.message}\n\nIsso pode indicar:\n- N8N está fora do ar\n- URL incorreta\n- Problema de CORS\n- Firewall bloqueando`, true);
                }
            }
        }
        
        async function testLocalAPI() {
            const url = 'http://localhost:3000/api/webhook/n8n';
            const payload = {
                selectedServicePlan: 'Premium',
                userName: 'Teste API Local',
                userEnterprise: 'Empresa Local',
                userNumber: '48999887766',
                userMessage: 'Teste da API local',
                promoActive: true
            };
            
            addResult('🏠 Testando API Local...', `URL: ${url}\nPayload: ${JSON.stringify(payload, null, 2)}`);
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const responseData = await response.json();
                
                if (response.ok && responseData.success) {
                    addResult('✅ API Local Funcionando!', `Status: ${response.status}\nResposta: ${JSON.stringify(responseData, null, 2)}`);
                } else {
                    addResult('❌ API Local com Erro', `Status: ${response.status}\nResposta: ${JSON.stringify(responseData, null, 2)}`, true);
                }
            } catch (error) {
                addResult('❌ Erro API Local', `Erro: ${error.message}\n\nCertifique-se que está rodando: npm run dev`, true);
            }
        }
        
        async function testProdAPI() {
            const url = 'https://komprax.vercel.app/api/webhook/n8n';
            const payload = {
                selectedServicePlan: 'Premium',
                userName: 'Teste API Produção',
                userEnterprise: 'Empresa Produção',
                userNumber: '48999887766',
                userMessage: 'Teste da API em produção',
                promoActive: true
            };
            
            addResult('🌐 Testando API Produção...', `URL: ${url}\nPayload: ${JSON.stringify(payload, null, 2)}`);
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const responseData = await response.json();
                
                if (response.ok && responseData.success) {
                    addResult('✅ API Produção Funcionando!', `Status: ${response.status}\nResposta: ${JSON.stringify(responseData, null, 2)}`);
                } else {
                    addResult('❌ API Produção com Erro', `Status: ${response.status}\nResposta: ${JSON.stringify(responseData, null, 2)}`, true);
                }
            } catch (error) {
                addResult('❌ Erro API Produção', `Erro: ${error.message}`, true);
            }
        }
        
        // Teste automático ao carregar
        window.onload = function() {
            addResult('🚀 Página Carregada', 'Clique nos botões acima para testar cada endpoint.\n\nOrdem recomendada:\n1. Teste N8N Direto\n2. Teste API Local\n3. Teste API Produção');
        };
    </script>
</body>
</html>
